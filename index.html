<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>Torre VIV · Amazon FBA</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2032%2032%22%3E%3Crect%20width=%2232%22%20height=%2232%22%20rx=%228%22%20fill=%22%230E2238%22/%3E%3Cpath%20d=%22M16%205.5%2026%2011%2016%2016.5%206%2011z%22%20fill=%22%23FFB02E%22/%3E%3Cpath%20d=%22M6%2011v10.2l10%205.3V16.5M26%2011v10.2l-10%205.3%22%20fill=%22none%22%20stroke=%22%23FFB02E%22%20stroke-width=%221.9%22%20stroke-linejoin=%22round%22/%3E%3Cpath%20d=%22M16%2016.5%2026%2011%22%20stroke=%22%230E2238%22%20stroke-width=%221.2%22%20opacity=%22.35%22/%3E%3C/svg%3E">
<meta name="theme-color" content="#F3F4F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E2238" media="(prefers-color-scheme: dark)">
<style>
:root{
  --bg:#F3F4F6; --surface:#FFFFFF; --surface-2:#F7F8FA; --ink:#0C1015; --ink-2:#343C48; --muted:#596273;
  --line:#E2E5EA; --grid:#ECEEF1;
  --blue:#2160E0; --green:#0B8048; --red:#C42E1C; --amber:#A65800; --orange:#D2550C; --slate:#5E6B7E;
  --blue-bg:rgba(33,96,224,.10); --green-bg:rgba(11,128,72,.11); --red-bg:rgba(196,46,28,.09); --amber-bg:rgba(166,88,0,.12);
  --shadow:0 1px 2px rgba(15,20,30,.04),0 4px 14px rgba(15,20,30,.05);
  --r:18px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Inter,"Segoe UI",Roboto,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
:root[data-theme=dark]{
  --bg:#090B0F; --surface:#11151B; --surface-2:#161B22; --ink:#ECEFF3; --ink-2:#C5CCD6; --muted:#939DAC;
  --line:#2A323D; --grid:#222A35;
  --blue:#6AA3FF; --green:#3FD18C; --red:#FF7462; --amber:#F2B544; --orange:#FF9152; --slate:#A3B0C2;
  --blue-bg:rgba(106,163,255,.13); --green-bg:rgba(63,209,140,.12); --red-bg:rgba(255,116,98,.12); --amber-bg:rgba(242,181,68,.13);
  --shadow:0 1px 0 rgba(255,255,255,.02),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1,"cv11" 1}
.num,.kv,td.n,.tabular{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px;border-radius:8px}
.app{max-width:1240px;margin:0 auto;padding:0 20px 40px}
/* topo */
.topbar{position:sticky;top:0;z-index:30;margin:0 -20px;padding:14px 20px 10px;background:color-mix(in srgb,var(--bg) 84%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px)}
.head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.logo{width:40px;height:40px;border-radius:11px;flex:none;box-shadow:0 1px 2px rgba(14,34,56,.35),inset 0 0 0 1px rgba(255,255,255,.06)}
.logo svg{display:block;border-radius:11px}
.ttl{min-width:0;flex:1}
.ttl h1{font-size:19px;line-height:1.15;margin:0;font-weight:750;letter-spacing:-.02em}
.ttl p{margin:2px 0 0;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:6px;vertical-align:1px;box-shadow:0 0 0 0 var(--green);animation:pulse 2.4s infinite}
.live.warn{background:var(--amber);animation:none} .live.bad{background:var(--red);animation:none}
.atraso{margin-top:14px;padding:10px 14px;border-radius:12px;font-size:13.5px;font-weight:600;display:flex;gap:8px;align-items:center}
.atraso.warn{background:var(--amber-bg);color:var(--amber)} .atraso.bad{background:var(--red-bg);color:var(--red)}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--green) 55%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.iconbtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:18px;height:18px}
.tabs{position:relative;display:flex;gap:2px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;box-shadow:var(--shadow)}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;z-index:1;flex:1 0 auto;border:0;background:none;padding:9px 14px;border-radius:10px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;transition:color .25s}
.tab[aria-selected=true]{color:var(--surface)}
.glider{position:absolute;z-index:0;top:4px;left:0;height:calc(100% - 8px);border-radius:10px;background:var(--ink);transition:transform .42s cubic-bezier(.3,.8,.2,1),width .42s cubic-bezier(.3,.8,.2,1)}
/* grade e cartões */
.panel{padding-top:24px;display:flex;flex-direction:column;gap:24px}
.panel[hidden]{display:none}
.panel>*{margin-top:0;margin-bottom:0}
.row{display:grid;gap:16px}
.intro h2{margin:0;font-size:22px;font-weight:750;letter-spacing:-.02em;line-height:1.2}
.intro p{margin:4px 0 0;color:var(--muted);font-size:14px}
.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.c-7-5{grid-template-columns:minmax(0,7fr) minmax(0,5fr);align-items:start}
@container (max-width:240px){.kpi .kv{font-size:clamp(21px,16cqi,32px)}}
.kpis{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(176px,1fr))}
.kpis.k8{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;box-shadow:var(--shadow);min-width:0}
.card h2,.card h3{margin:0;font-size:15px;font-weight:650;letter-spacing:-.005em}
.card .sub{margin:3px 0 0;color:var(--muted);font-size:12.5px}
.chead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.chead>div:first-child{min-width:0;flex:1 1 220px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12px;color:var(--muted);margin-top:16px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:12px;height:10px;border-radius:3px}
.sw.l{height:3px;border-radius:2px;width:16px}
.sw.t{height:2px;width:16px;opacity:.55}
.sw.d{height:0;width:16px;border-top:2px dashed currentColor;background:none!important;border-radius:0}
.sw.b{height:10px;border-radius:2px}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.note b{color:var(--ink-2);font-weight:600}
/* KPI */
.kpi{container-type:inline-size;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:4px;padding:16px}
.kpi .lb{font-size:13px;color:var(--ink-2);font-weight:600;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.kpi .lb span{min-width:0}
.kpi .lb em{font-style:normal;font-weight:500;font-size:11.5px;color:var(--muted);white-space:nowrap}
.kv{font-size:clamp(22px,5.6vw,32px);font-weight:750;letter-spacing:-.025em;line-height:1.1;margin-top:4px;white-space:nowrap}
.kv.bad{color:var(--red)} .kv.warn{color:var(--amber)} .kv.good{color:var(--green)}
.kpi .ks{font-size:12px;color:var(--muted);line-height:1.4}
.kpi .ks b{color:var(--ink-2);font-weight:600}
.kpi .sp{display:block;width:100%;height:40px;margin-top:auto;overflow:visible}
.kpi .kline{margin:2px 0 12px}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:650;padding:2px 7px;border-radius:999px;white-space:nowrap}
.chip.good{color:var(--green);background:var(--green-bg)} .chip.bad{color:var(--red);background:var(--red-bg)}
.chip.warn{color:var(--amber);background:var(--amber-bg)} .chip.mut{color:var(--muted);background:var(--surface-2)}
.chip.info{color:var(--blue);background:var(--blue-bg)}
.kline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
/* manchete */
.manchete{padding:24px;background:linear-gradient(135deg,color-mix(in srgb,var(--blue) 9%,var(--surface)),var(--surface) 60%)}
.manchete .eyebrow{font-size:12px;font-weight:650;color:var(--blue);text-transform:uppercase;letter-spacing:.08em}
.manchete .big{font-size:clamp(20px,4.6vw,27px);font-weight:700;letter-spacing:-.015em;line-height:1.25;margin:8px 0 16px}
.mchips{display:flex;flex-wrap:wrap;gap:8px}
.mchips span{font-size:13px;padding:5px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}
/* decisões */
.dlist{list-style:none;margin:0;padding:0;columns:2;column-gap:40px}
.dlist li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line);break-inside:avoid}
@media (max-width:860px){.dlist{columns:1}}
.dlist li:first-child{border-top:0}
.dn{width:26px;height:26px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink-2)}
.dt{font-size:14px;line-height:1.4}
.dmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px;align-items:center}
.go{font-size:12px;font-weight:600;color:var(--blue);background:none;border:0;padding:2px 0;cursor:pointer}
.go:hover{text-decoration:underline}
/* tabela */
.tw{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:11.5px;color:var(--muted);font-weight:600;text-align:left;padding:0}
th button{background:none;border:0;padding:8px 6px;font-size:11.5px;font-weight:650;color:var(--muted);cursor:pointer;display:inline-flex;gap:4px;align-items:center;text-transform:uppercase;letter-spacing:.04em}
th[aria-sort] button{color:var(--ink)}
th.n,td.n{text-align:right} th.n button{justify-content:flex-end;width:100%}
td{padding:9px 6px;border-top:1px solid var(--line);white-space:nowrap}
td.sku{font-family:var(--mono);font-size:12.5px;font-weight:600}
.pill{display:inline-block;font-size:12px;font-weight:650;padding:2px 8px;border-radius:999px}
.pill.bad{color:var(--red);background:var(--red-bg)} .pill.warn{color:var(--amber);background:var(--amber-bg)} .pill.ok{color:var(--ink-2);background:var(--surface-2)}
.minibar{display:inline-block;height:6px;border-radius:3px;background:var(--blue);opacity:.75;vertical-align:middle;margin-right:6px;transform-origin:left;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
/* segmentado */
.seg{display:inline-flex;padding:3px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line);gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.stats{display:flex;gap:22px;flex-wrap:wrap}
.stat .sl{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.stat .sv{font-size:18px;font-weight:700;letter-spacing:-.01em}
.stat .sv small{font-size:12px;color:var(--muted);font-weight:500}
/* gráfico */
.chart{position:relative;touch-action:pan-y;overscroll-behavior:contain;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.chart svg{display:block;overflow:visible}
.chart text{font-size:11px;fill:var(--muted);font-family:var(--font);font-variant-numeric:tabular-nums}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .z{stroke:var(--line);stroke-width:1.2}
.ln{fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.ln.thin{stroke-width:1.2;opacity:.5}
.gapl{stroke-width:1.4;stroke-dasharray:2 4;opacity:.75;fill:none}
.cxl{stroke:var(--ink);stroke-opacity:.35;stroke-width:1}
.cxd{stroke:var(--surface);stroke-width:2}
.brush{fill:var(--blue);fill-opacity:.12;stroke:var(--blue);stroke-opacity:.5}
.reflbl{font-weight:650;font-size:11px}
.tip{position:absolute;top:0;left:0;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.16);padding:9px 11px;font-size:12.5px;min-width:170px;z-index:5}
.tip.on{opacity:1;transform:none}
.tip-d{font-weight:700;margin-bottom:5px;color:var(--ink)}
.tip-r{display:grid;grid-template-columns:10px 1fr auto;gap:7px;align-items:center;margin-top:3px;color:var(--ink-2)}
.tip-r i{width:9px;height:9px;border-radius:3px;display:block}
.tip-r b{font-weight:650;font-variant-numeric:tabular-nums;color:var(--ink)}
.tip-r.mute b{color:var(--muted);font-weight:500}
.crow{min-height:27px;display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:6px 10px;margin-bottom:8px}
.ctl{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
.ctl button{font-size:11.5px;font-weight:650;padding:3px 9px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;font-family:var(--font)}
.ctl button:hover{color:var(--ink)}
.ctl button[aria-pressed="true"]{color:var(--blue);border-color:var(--blue)}
.ctl .unzoom{color:var(--blue)}
.ctl button.off{opacity:.38;cursor:not-allowed}
.ctl button.off:hover{color:var(--muted)}
.gbadge[hidden]{display:block;visibility:hidden;flex:1 1 0;padding:0}
.gbadge{flex:1 1 240px;min-width:0;font-size:11px;color:var(--muted);background:var(--surface-2);padding:3px 9px;border-radius:8px;line-height:1.3}
.bar.parcial{stroke-linejoin:round}

.tip-n{margin-top:7px;font-size:11px;color:var(--muted)}
.tip-and{font-weight:650;color:var(--amber);font-size:11px;margin-left:4px}
.chart.zm svg{cursor:crosshair}
.zdica{margin:6px 2px 0}
.pesc{display:inline-flex;align-items:center;gap:4px;margin-left:10px}
.pesc .pl2{font-size:11.5px;color:var(--muted);margin-right:2px}
.pesc button{font-size:11.5px;font-weight:650;padding:4px 9px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;font-family:var(--font)}
.pesc button[aria-pressed="true"]{color:var(--blue);border-color:var(--blue)}
.hint{font-size:11.5px;color:var(--muted)}
/* comparação */
.cmp{width:100%}
.cmp td{padding:8px 4px}
.cmp td:first-child{color:var(--ink-2);white-space:normal}
.cmp td.muted{color:var(--muted)}
/* heatmap */
.hm-wrap{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:22px;align-items:start}
.hm-scroll{overflow-x:auto;position:relative;padding-bottom:4px}
.hm-scroll svg text{font-size:10px;fill:var(--muted)}
.hm-c{transition:opacity .4s}
.hmleg{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.hmleg .ramp{width:110px;height:9px;border-radius:5px;background:linear-gradient(90deg,color-mix(in oklab,var(--blue) 8%,var(--surface-2)),var(--blue))}
.wd{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12.5px;margin:6px 0}
.wd .track{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.wd .fill{height:100%;border-radius:5px;background:var(--blue);opacity:.8;transform-origin:left;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.wd.top .fill{opacity:1}
/* produtos */
.rank{list-style:none;margin:0;padding:0}
.rank li{display:grid;grid-template-columns:24px 116px minmax(80px,1fr) 104px 70px 96px 82px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}
.rank li:first-child{border-top:0}
.rank .rk{color:var(--muted);font-weight:650;font-size:12px}
.rank .bar{height:12px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.rank .bar i{display:block;height:100%;border-radius:6px;background:var(--blue);transform-origin:left;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.rank .v{text-align:right;font-weight:650}
.rank .u{text-align:right;color:var(--muted);font-size:12.5px}
.rank .spk{height:26px;width:82px;display:block}
.rank .nos{font-size:11px;color:var(--muted)}
.rank-h{display:grid;grid-template-columns:24px 116px minmax(80px,1fr) 104px 70px 96px 82px;gap:10px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:650;padding-bottom:6px}
.rank-h .r{text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{font-family:var(--mono);font-size:12.5px;font-weight:650;padding:5px 9px;border-radius:9px;background:var(--red-bg);color:var(--red)}
.ring{display:flex;align-items:center;gap:16px}
.ring svg{width:96px;height:96px;flex:none}
.ring .rv{font-size:26px;font-weight:750}
.rscroll{max-height:640px;overflow-y:auto;overscroll-behavior:auto;scrollbar-width:thin}
.rscroll.smgrid{max-height:330px;padding-right:6px}
.rank .sku{white-space:nowrap}
.rscroll:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}
.mais{margin-top:8px;text-align:center}
.lbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:4px 0 14px}
.lbar input,.lbar select{font:inherit;font-size:13px;padding:7px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.lbar input{min-width:0;flex:1 1 150px}
.lbar select{max-width:100%}
.lbar .seg{max-width:100%;overflow-x:auto}
.rscroll{overflow-x:hidden}
.cv{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:6px;margin-left:4px;vertical-align:1px;background:var(--surface-2);color:var(--muted)}
.cvA{background:var(--blue-bg,rgba(80,120,255,.14));color:var(--blue)}
.smgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.smc h4{margin:0 0 2px;font-family:var(--mono);font-size:13px}
.smc .smv{font-size:12.5px;color:var(--muted)}
/* história */
.hist{padding:20px}
.hist-top{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px;align-items:end;margin-bottom:12px}
.clock-dow{font-size:13px;font-weight:650;color:var(--blue);text-transform:uppercase;letter-spacing:.08em;min-height:19px}
.clock-date{font-size:clamp(30px,7vw,44px);font-weight:750;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums}
.clock-sub{font-size:12px;color:var(--muted);margin-top:4px}
.hk{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.hk>div{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:9px 11px;min-width:0}
.hk .sl{font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hk .sv{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-chart{position:relative;margin-top:6px}
.hist-chart text{font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}
.hist-chart .ptl{font-size:11.5px;font-weight:650;fill:var(--ink-2)}
.hctrl{display:flex;align-items:center;gap:14px;margin-top:12px;flex-wrap:wrap}
.play{width:52px;height:52px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);display:grid;place-items:center;cursor:pointer;flex:none;box-shadow:0 6px 18px rgba(0,0,0,.18);transition:transform .15s}
.play:active{transform:scale(.94)}
.play svg{width:20px;height:20px}
.slider{flex:1 1 220px;min-width:0;accent-color:var(--blue);height:28px}
.toast{position:absolute;left:50%;top:6px;transform:translate(-50%,-6px);opacity:0;transition:opacity .3s,transform .3s;background:var(--ink);color:var(--bg);padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:650;pointer-events:none;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translate(-50%,0)}
.marcos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:16px}
.marco{text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px 12px;cursor:pointer}
.marco:hover{border-color:var(--blue)}
.marco .ml{font-size:11.5px;color:var(--muted);font-weight:600}
.marco .mv{font-size:14px;font-weight:650;margin-top:2px}
/* rodapé */
footer{margin-top:22px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px;display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
/* período global */
.pbar{display:flex;align-items:center;gap:10px;margin-top:6px;padding:4px 3px;flex-wrap:wrap}
.pchips{max-width:100%;overflow-x:auto;scrollbar-width:none;padding:5px 3px}
.pchip .ps{display:none}
.pchips::-webkit-scrollbar{display:none}
.pbar[hidden]{display:none}
.pchips{display:inline-flex;gap:6px}
.pchip{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);padding:6px 13px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .2s,color .2s,border-color .2s}
.pchip:hover{border-color:var(--blue)}
.pchip[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:var(--bg)}
.ptxt{margin-left:auto;font-size:12.5px;color:var(--muted);padding-left:6px;min-width:0;text-align:right}
/* notas recolhidas */
details.notas{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
details.notas summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted);list-style:none;display:inline-flex;gap:6px;align-items:center}
details.notas summary::-webkit-details-marker{display:none}
details.notas summary::before{content:"";width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .2s}
details.notas[open] summary::before{transform:rotate(45deg)}
details.notas .note:first-of-type{margin-top:10px}
/* movimento */
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.panel.in .rise{animation:rise .62s cubic-bezier(.2,.75,.2,1) both;animation-delay:calc(var(--i,0)*55ms)}
.enter .bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow .55s cubic-bezier(.2,.75,.2,1) both}
.enter .fade{animation:fadein .9s ease both}
.noanim *,.noanim *::before,.noanim *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* responsivo */
@media (max-width:980px){
  .kpis.k8{grid-template-columns:repeat(2,minmax(0,1fr))}
  .c-7-5,.c3{grid-template-columns:minmax(0,1fr)}
  .hm-wrap{grid-template-columns:minmax(0,1fr)}
  .rank li,.rank-h{grid-template-columns:22px 108px minmax(40px,1fr) 96px 64px 90px}
  .rank .spkc,.rank-h .spkc{display:none}
  .hk{grid-template-columns:repeat(3,minmax(0,1fr))}
  .marcos{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:720px){
  .c2{grid-template-columns:minmax(0,1fr)}
  .smgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hist-top{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .pchip .pl{display:none} .pchip .ps{display:inline}
  .pchip{padding:6px 11px}
  .ptxt{font-size:11.5px;flex:1 1 100%;text-align:left;padding-left:3px}
  .app{padding:0 12px 30px}
  .topbar{margin:0 -12px;padding:10px 12px 8px}
  .head{margin-bottom:9px}
  .ttl h1{font-size:16.5px}
  .hide-sm{display:none}
  .card{padding:16px;border-radius:16px}
  .panel{gap:16px;padding-top:16px}
  .row{gap:12px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .kpi{padding:12px}
  .kpi .sp{height:32px}
  .kpi .kline{margin-bottom:8px}
  .intro h2{font-size:19px}
  .intro p{font-size:13px}
  #tRep{font-size:12.5px}
  #tRep td{padding:10px 4px}
  #tRep td.sku{font-size:11.5px}
  #tRep .minibar{display:none}
  #tRep th button{padding:8px 4px;font-size:10.5px;letter-spacing:.02em;white-space:normal;text-align:right;line-height:1.2}
  #tRep .pill{padding:2px 6px;font-size:11.5px}
  .kpi .lb em{display:none}
  .tab{padding:8px 11px;font-size:13.5px}
  .manchete{padding:16px}
  .rank li,.rank-h{grid-template-columns:20px minmax(0,1fr) 84px 76px;gap:6px 8px}
  .rank li .bar{grid-column:2 / 5;grid-row:2;height:8px}
  .rank .u,.rank-h .uc{display:none}
  .rank-h .barc{display:none}
  .stats{gap:14px}
  .stat .sv{font-size:16px}
  .hk{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hk>div:first-child{grid-column:1 / 3}
  .smgrid{grid-template-columns:minmax(0,1fr)}
  .marcos{grid-template-columns:minmax(0,1fr)}
  .seg button{padding:6px 10px}
}
</style>

/* lista que carrega mais linhas conforme a rolagem (Produtos e Estoque) */
function listaRolavel(box, itens, linha, lote) {
  lote = lote || 25;
  var st = { it: itens, n: lote }, rs = box.querySelector('.rscroll'), ul = box.querySelector('ol.rank'), mais = box.querySelector('.mais');
  function pinta(reset) {
    if (reset) { ul.innerHTML = ''; st.n = lote; rs.scrollTop = 0; }
    var ja = ul.children.length, fim = Math.min(st.it.length, st.n), h = '', j;
    for (j = ja; j < fim; j++) h += linha(st.it[j], j);
    if (h) {
      ul.insertAdjacentHTML('beforeend', h);
      for (j = ja; j < fim; j++) { growBars(ul.children[j]); drawLines(ul.children[j]); }
    }
    mais.textContent = st.it.length ? 'Mostrando ' + fim + ' de ' + st.it.length + (fim < st.it.length ? ' · role a lista para ver mais' : ' · fim da lista') : 'Nenhum SKU neste filtro.';
  }
  rs.addEventListener('scroll', function () { if (st.n < st.it.length && rs.scrollTop + rs.clientHeight >= rs.scrollHeight - 140) { st.n += lote; pinta(false); } }, { passive: true });
  pinta(true);
  return { set: function (it) { st.it = it; pinta(true); } };
}

  function interp(a, i, fr) { var v0 = a[i], v1 = a[Math.min(i1, i + 1)]; if (v0 == null) return null; if (v1 == null) return v0; return v0 + (v1 - v0) * fr; }
  var ultDia = -1;
  function frame() {
    if (!G) return;

    var x = G.X(gi);
    G.clip.setAttribute('width', Math.max(0, x - G.L + 2 + (t >= n - 1 ? 8 : 0)));
    G.head.setAttribute('x1', x); G.head.setAttribute('x2', x);
    var yf = interp(S.fat7, i, fr); pon(G.d1, x, yf != null ? G.YF(yf) : null); pon(G.d1g, x, yf != null ? G.YF(yf) : null);
    var ym = interp(S.marg7, i, fr); pon(G.d2, x, ym != null ? G.YM(ym) : null);
    var ye = interp(S.a60, i, fr); pon(G.d3, x, ye != null ? G.YE(ye) : null);
    var ac = cum[i] + (i < i1 && S.fat[i + 1] != null ? S.fat[i + 1] * fr : 0);

      el.es.textContent = S.a60[i] == null ? 'sem dado' : fNum(S.a60[i]); el.es.style.color = S.a60[i] == null ? 'var(--muted)' : 'var(--red)';
      sl.value = i - i0; sl.setAttribute('aria-valuetext', ddmmaa(i));
      if (playing) EV.forEach(function (e) { if (e.i === i && !evVisto[e.i]) { evVisto[e.i] = 1; toast.textContent = ddmm(e.i) + ': ' + e.t; toast.classList.add('on'); setTimeout(function () { toast.classList.remove('on'); }, 2200); } });
    }
  }
  function loop(ts) {

  btn.innerHTML = ICON_PLAY;

  ligaSeg(p, function (w) { vel = parseFloat(w) || 1; });
  p.querySelectorAll('.marco').forEach(function (b) { b.addEventListener('click', function () { pausa(); t = Math.max(0, Math.min(n - 1, +b.getAttribute('data-i') - i0)); frame(); }); });
  HIST = { resize: function () { if (box.clientWidth && (!G || Math.abs(box.clientWidth - G.W) > 2)) build(); }, pausa: pausa };
  build();
  if (MOTION) setTimeout(function () { if (!playing && t === 0 && ATUAL === 'historia') play(); }, 700);
}

function montaPbar() {
